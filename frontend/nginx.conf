server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://coursesphere-8bd9a-default-rtdb.firebaseio.com wss://coursesphere-8bd9a-default-rtdb.firebaseio.com; frame-src https://coursesphere-8bd9a.firebaseapp.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # The deployment gateway must route /api to the API over HTTPS.
    # Fail closed if this container is exposed without that gateway.
    location /api/ { return 503; }

    location / { try_files $uri $uri/ /index.html; }
}
