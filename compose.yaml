name: coursesphere

x-backend: &backend
  image: coursesphere-backend:local
  build: ./backend
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 512m
  environment: &backend-environment
    COURSESPHERE_LOCAL: "1"
    COURSESPHERE_EMULATOR_HOST: firebase-emulators
    COURSESPHERE_RATE_LIMIT_STORAGE_URI: redis+unix:///run/redis/redis.sock
    COURSESPHERE_METRICS_TOKEN_FILE: /run/secrets/metrics_token
    COURSESPHERE_TRUSTED_PROXY: "172.30.90.10"
  secrets: [metrics_token]
  volumes:
    - redis_socket:/run/redis:ro
  networks: [app]
  depends_on:
    redis:
      condition: service_healthy
    firebase-emulators:
      condition: service_healthy

services:
  backend-1:
    <<: *backend
    environment:
      <<: *backend-environment
      COURSESPHERE_INSTANCE_ID: backend-1
  backend-2:
    <<: *backend
    environment:
      <<: *backend-environment
      COURSESPHERE_INSTANCE_ID: backend-2

  frontend:
    image: coursesphere-frontend:local
    build:
      context: ./frontend
      args:
        VITE_USE_FIREBASE_EMULATORS: "true"
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    networks: [app]

  gateway:
    image: nginx:stable-alpine
    user: "101:101"
    entrypoint: [nginx, -g, "daemon off;"]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      app:
        ipv4_address: 172.30.90.10
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/api/health]
      interval: 10s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8-alpine
    command: [redis-server, --port, "0", --unixsocket, /data/redis.sock, --unixsocketperm, "666", --save, "", --appendonly, "no"]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    volumes:
      - redis_socket:/data
    # No network socket or TCP port; only the two API containers mount this volume.
    network_mode: none
    healthcheck:
      test: [CMD, redis-cli, -s, /data/redis.sock, ping]
      interval: 5s
      timeout: 3s
      retries: 10

  firebase-emulators:
    image: coursesphere-firebase-emulators:local
    build:
      context: .
      dockerfile: deploy/firebase/Dockerfile
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    environment:
      JAVA_TOOL_OPTIONS: -Xmx512m
    ports: ["127.0.0.1:9099:9099", "127.0.0.1:9000:9000"]
    volumes:
      - firebase_data:/data
    networks: [app]
    stop_grace_period: 30s

secrets:
  metrics_token:
    file: ./.tools/docker/metrics-token.txt

volumes:
  redis_socket:
  firebase_data:

networks:
  app:
    ipam:
      config:
        - subnet: 172.30.90.0/24
