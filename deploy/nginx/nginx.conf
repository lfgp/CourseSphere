worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    client_max_body_size 256k;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $uri $safe_route {
        default "unmatched";
        /api/health "/health";
        /api/users/info "/users/info";
        /api/users/query "/users/query";
        /api/hash "/hash";
        ~^/api/chats/[^/]+/messages$ "/chats/<chat_id>/messages";
        ~^/api/chats/[^/]+$ "/chats/<chat_id>";
    }
    log_format safe_json escape=json '{"timestamp":"$time_iso8601","event":"gateway_request","route":"$safe_route","status":$status,"instance":"$upstream_http_x_backend_instance","request_id":"$upstream_http_x_request_id","duration_seconds":$request_time}';
    access_log /dev/stdout safe_json;
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Equal weights, shared round-robin state across Nginx workers.
    upstream api {
        zone api 64k;
        server backend-1:5000 resolve max_fails=2 fail_timeout=10s;
        server backend-2:5000 resolve max_fails=2 fail_timeout=10s;
        keepalive 16;
    }
    upstream web {
        zone web 32k;
        server frontend:3000 resolve;
        keepalive 8;
    }
    server {
        listen 8080;
        server_name _;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        # Keep one authoritative copy instead of duplicating upstream security headers.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;

        # No public scrape through the load balancer, including suffixes/encoded aliases.
        location ~ ^/api/+metrics(?:/|$) { return 404; }
        location /api/ {
            proxy_pass http://api/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_connect_timeout 2s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            # Never retry non-idempotent writes or application 500/503 responses.
            proxy_next_upstream error timeout;
            proxy_next_upstream_tries 2;
        }
        location / {
            proxy_pass http://web;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}
